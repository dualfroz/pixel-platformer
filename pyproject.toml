[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-platformer"
version = "0.1.0"
description = "A 2D platformer in Python and pygame with a headless simulation and precise, forgiving movement."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Michał Fox" }]
requires-python = ">=3.8"
dependencies = ["pygame>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["game*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
